apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-control-plane-smoke-20260928
  namespace: or-sim
  labels:
    or-sim.io/smoke: ampere-batch-concurrency
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          command: [/busybox/sh, -c]
          args:
            - >-
              set -eu;
              mkdir -p /workspace/context;
              tar -xzf /input/context.tar.gz -C /workspace/context;
              /kaniko/executor
              --context=/workspace/context
              --dockerfile=/workspace/context/Dockerfile.control-plane
              --destination=localhost:10690/migrant-control-plane:smoke-20260928
              --insecure --skip-tls-verify
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-smoke-build-context-20260928
---
