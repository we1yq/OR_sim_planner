# Fast-start runtime release 2 (2026-09-30), built from commit 8f56100: as fast-20260930,
# but /healthz and /metrics answer from a cached snapshot instead of waiting
# for the inference child.  Control-plane image unchanged (fast-20260930).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-fast2-llama-runtime-20260930
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.llama32-3b \
                --destination=localhost:10690/migrant-model-runtime:llama32-3b-fast2-20260930 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-fast2-runtime-context-20260930
