# Pipeline release (2026-09-29): router keeps up to VISION_PIPELINE_DEPTH (2)
# vision batches in flight per replica (the second only when full), so the
# router<->runtime round trip overlaps GPU work; runtimes serialise inference
# behind an infer lock and report inferQueueMs.  Runtime images overlay the
# same bases as cpuset/ttft.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-pipe-llama-runtime-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.llama32-3b \
                --destination=localhost:10690/migrant-model-runtime:llama32-3b-pipe-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-pipe-runtime-context-20260929
