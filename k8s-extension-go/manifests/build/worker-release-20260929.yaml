# Worker release (2026-09-29): runtimes run every CUDA call (load, warm-up,
# inputs, inference) on one long-lived thread instead of the per-request
# ThreadingHTTPServer thread, whose first CUDA call set up per-thread state
# and added ~6 ms idle GPU time per call (vgg16 b1 2g: 10.4 -> 4.2 ms).
# Router stays pipe-20260929.  The planner-engine image bakes the vision
# catalogs rebuilt from profile/20260929-worker.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-worker-llama-runtime-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.llama32-3b \
                --destination=localhost:10690/migrant-model-runtime:llama32-3b-worker-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-worker-runtime-context-20260929
