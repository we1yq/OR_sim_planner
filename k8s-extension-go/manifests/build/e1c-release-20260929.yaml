# E1c release (2026-09-29): router forms vision batches when the replica can
# take one (pull-based), so batches fill to BatchSize under load; one batch or
# LLM request per replica at a time.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-e1c-router-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.runtime-router \
                --destination=localhost:10690/migrant-runtime-router:e1c-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-e1c-context-20260929

