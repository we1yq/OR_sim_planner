# TTFT release (2026-09-29): transformers runtime measures TTFT inside the
# single generate() call (first-token stopping-criteria mark) instead of a
# separate prefill forward, so each request runs one prefill; TPOT =
# (total - TTFT) / (output_tokens - 1).  Overlay on the same bases as cpuset.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-ttft-llama-runtime-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.llama32-3b \
                --destination=localhost:10690/migrant-model-runtime:llama32-3b-ttft-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-ttft-runtime-context-20260929
---
