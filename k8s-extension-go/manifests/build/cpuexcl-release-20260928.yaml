# Runtime CPU-exclude release (2026-09-28).
# control-plane: transition-executor passes node annotation
#   mig.or-sim.io/runtime-cpu-exclude to runtimes as OR_SIM_CPU_EXCLUDE.
# runtimes: the *-batchctl-20260926 images with only the runtime .py replaced
#   by the version that drops OR_SIM_CPU_EXCLUDE from its CPU affinity.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-cpuexcl-control-plane-20260928
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.control-plane \
                --destination=localhost:10690/migrant-control-plane:cpuexcl-20260928 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-cpuexcl-control-plane-context-20260928
