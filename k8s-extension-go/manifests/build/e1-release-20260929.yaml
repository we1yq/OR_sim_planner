# E1 release (2026-09-29): executor/router/node-agent concurrency and
# atomicity fixes, SW-C (capacity-gate + temporary-capacity-cleanup edges),
# and planner catalogs from profile/20260929 (per-GPU median, min over GPUs).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-e1-control-plane-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.control-plane \
                --destination=localhost:10690/migrant-control-plane:e1-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-e1-context-20260929
