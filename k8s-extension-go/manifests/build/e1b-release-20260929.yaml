# E1b release (2026-09-29): router runs one batch/request per replica at a
# time (ENDPOINT_MAX_CONCURRENCY, default 1); place_instance refreshes CDI only
# when an expected device is missing from the node's CDI spec.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-e1b-control-plane-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.control-plane \
                --destination=localhost:10690/migrant-control-plane:e1b-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-e1b-context-20260929
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrant-e1b-router-20260929
  namespace: or-sim
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: or-sim-control-plane
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              mkdir -p /workspace/context
              tar -xzf /input/context.tar.gz -C /workspace/context
              /kaniko/executor \
                --context=/workspace/context \
                --dockerfile=/workspace/context/Dockerfile.runtime-router \
                --destination=localhost:10690/migrant-runtime-router:e1b-20260929 \
                --insecure \
                --insecure-pull \
                --skip-tls-verify \
                --skip-tls-verify-pull
          volumeMounts:
            - name: context
              mountPath: /input
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: migrant-e1b-context-20260929
